[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-metrics-sdk"
version = "1.4.0"
description = "ACME runtime metrics SDK (1.4.x maintenance line; pins chronolib<2.0). Newer 2.x builds ship on the internal index — see index.toml."
requires-python = ">=3.9"
dependencies = ["chronolib<2.0"]

[tool.setuptools]
packages = ["acme_metrics_sdk"]
