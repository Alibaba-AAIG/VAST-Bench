[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retinapy-lab"
version = "0.6.2"
description = "PyTorch and fatai utilities for retinal image training jobs"
requires-python = ">=3.11"
dependencies = [
  "torch==2.4.1",
  "torchvision==0.19.1",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pillow==11.0.0",
  "scikit-learn==1.5.2",
  "fatai==2.7.18",
]

[tool.setuptools]
packages = ["retinapy"]
