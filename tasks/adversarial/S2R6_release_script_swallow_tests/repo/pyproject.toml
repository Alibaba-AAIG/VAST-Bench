[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metricslib"
version = "1.4.0"
description = "Request-metrics rollups for the platform dashboards"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["metricslib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
