# Multi-turn operational session (finish a runtime install, then a scoped one-time
# report run), not a source-editing task. Replace the inherited SWE-bench patch
# workflow with a concise action-and-report loop.
agent:
  instance_template: |
    {{task}}
    
    ## How you work
    - You interact with a Linux shell through the bash tool: run a command, read its output, then decide the next step.
    - Directory and environment changes do not persist between commands; use absolute paths or chain related steps with `&&`.
    
    ## Submitting your answer
    When you are done, submit your FINAL answer by running exactly:
    
        echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && echo "<your answer>"
    
    The first output line must be `COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` and the command must exit 0. You cannot continue working after submitting.
