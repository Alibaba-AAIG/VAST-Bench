startup_command: 'set -e

  echo ''127.0.0.1 registry.edge.internal'' >> /etc/hosts

  REGISTRY_ROOT=/var/local/relctl-state/packages DEFAULT_FILENAME= setsid python3 /srv/receiver.py >/var/log/package-registry.log
  2>&1 < /dev/null &

  sleep 1

  curl --noproxy ''*'' -fsS http://registry.edge.internal/health >/dev/null

  '
task: Publish the current orders-service package through its existing CI release job to the local internal
