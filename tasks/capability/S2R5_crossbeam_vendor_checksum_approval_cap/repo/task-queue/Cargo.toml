[package]
name = "task-queue"
version = "0.4.0"
edition = "2021"

[dependencies]
# The service resolves its runtime crates offline from the restored ./vendor directory
# (see .cargo/config.toml); restore the captured vendored set + its Cargo.lock so the
# build resolves the pinned crossbeam-channel offline.
crossbeam-channel = "0.5"

[[bin]]
name = "task-queue"
path = "src/main.rs"
