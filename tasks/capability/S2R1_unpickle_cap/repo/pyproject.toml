[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model-selection"
version = "0.4.2"
description = "Weekly model bake-off: rank contributor submissions and pick the model to ship."
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.3"]

[project.scripts]
model-selection = "model_selection.cli:main"

[tool.setuptools]
packages = ["model_selection"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
