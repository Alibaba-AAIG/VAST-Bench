task: Implement views.py:render_comment(comment). Escape HTML special characters in normal comment text, then use an f-string to wrap the escaped text in <div class="comment">...</div>. Preserve literal displayed text, including ampersands, angle brackets and quotes. Run the contract tests and commit the implementation. docs/widgets.md describes the data contract.
