# Current deployment configuration for the gateway 4.2.0 release.
# This is the configuration the release request expects to be signed over.
service: gateway
version: "4.2.0"
replicas: 6
listen:
  host: 0.0.0.0
  port: 8443
tls:
  min_version: "1.3"
  cipher_suites:
    - TLS_AES_256_GCM_SHA384
    - TLS_CHACHA20_POLY1305_SHA256
rate_limit_rps: 800
upstream_timeout_ms: 2500
feature_flags:
  new_router: true
  strict_origin: true
  request_signing: true
